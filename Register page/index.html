<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple register page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="one">
        <h2>Register page</h2>
        <label>Username</label>
        <input type="text"placeholder="Enter your username"class="name"required><br>
        <label>Email id</label>
        <input type="text"placeholder="Enter your Email id"class="email"><br>
        <label>Password</label>
        <input type="password"placeholder="Password"class="password" required><br>
        <label>Confirm password</label>
        <input type="password"placeholder="Confirm password"class="c-password"required><br>
        <a href="one"class="two">forget password?</a><br>
        <button type="submit"class="btn">submit</button>
    </div>
    
</body>
</html>
